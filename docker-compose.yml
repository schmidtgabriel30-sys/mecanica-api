services:

  mysql:
    container_name: mecanica-mysql
    image: mysql:8.4
    ports:
      - "3309:3306" 
    environment:
      MYSQL_DATABASE: mecanica_db
      MYSQL_USER: mecanica_user
      MYSQL_PASSWORD: root
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mecanica-mysql-data:/var/lib/mysql

  adminer:
    container_name: mecanica-adminer
    image: adminer
    ports:
      - "8041:8080"
    depends_on:
      - mysql

volumes:
  mecanica-mysql-data: